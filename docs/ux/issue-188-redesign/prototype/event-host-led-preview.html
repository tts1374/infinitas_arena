  function gameHud(){

    const historyItems=s.rounds.map(r=&gt;`&lt;button type=&quot;button&quot; class=&quot;arena-past-round cursor-interaction&quot; data-act=&quot;view-round&quot; data-round=&quot;${r.number}&quot;&gt;${icon(&#x27;music&#x27;)}&lt;span&gt;&lt;small&gt;ROUND ${r.number}${r.invalid?&#x27; · 無効&#x27;:&#x27;&#x27;}&lt;/small&gt;&lt;strong&gt;${esc(r.chart.title)}&lt;/strong&gt;&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
    const management=host()&amp;&amp;!ended?`${s.phase===&#x27;ready&#x27;?button(&#x27;譜面を選び直す&#x27;,&#x27;reselect&#x27;,&#x27;&#x27;,s.hostLost||s.selfLost):&#x27;&#x27;}${playingNow?button(`進行中の第${s.round}曲を締め切る`,&#x27;deadline&#x27;,&#x27;&#x27;,s.hostLost||s.selfLost)+button(`進行中の第${s.round}曲を無効にする`,&#x27;invalidate&#x27;,&#x27;danger&#x27;,s.hostLost||s.selfLost):&#x27;&#x27;}${prior&amp;&amp;s.rounds.length?button(&#x27;直前の曲を無効にする&#x27;,&#x27;invalidate&#x27;,&#x27;danger&#x27;,s.hostLost||s.selfLost,`data-round=&quot;${s.rounds.at(-1).number}&quot;`):&#x27;&#x27;}${button(&#x27;開催を終了する&#x27;,&#x27;end&#x27;,&#x27;&#x27;,s.hostLost||s.selfLost)}`:&#x27;&#x27;;
    const skip=plays()&amp;&amp;playingNow&amp;&amp;activeSelf()&amp;&amp;s.selfStatus===&#x27;pending&#x27;&amp;&amp;!s.nextWait&amp;&amp;!s.casualWait?button(&#x27;この曲をスキップする&#x27;,&#x27;skip&#x27;,&#x27;&#x27;,s.hostLost||s.selfLost):&#x27;&#x27;;
    return `&lt;aside class=&quot;arena-hud&quot;&gt;&lt;section&gt;&lt;h2&gt;ここまでの曲&lt;/h2&gt;${historyItems||&#x27;&lt;div class=&quot;arena-history-placeholder&quot;&gt;曲別結果は&lt;br&gt;ここに残ります&lt;/div&gt;&#x27;}&lt;/section&gt;&lt;section&gt;&lt;h2&gt;開催情報&lt;/h2&gt;&lt;div class=&quot;arena-hud-facts&quot;&gt;&lt;div&gt;&lt;small&gt;モード&lt;/small&gt;&lt;strong&gt;${typeLabel()}&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;指標&lt;/small&gt;&lt;strong&gt;${s.metric}&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;参加者&lt;/small&gt;&lt;strong&gt;${s.people-s.kicked.length} / 20&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;Host&lt;/small&gt;&lt;strong&gt;${s.role===&#x27;host-player&#x27;?&#x27;プレー兼任&#x27;:&#x27;進行専任&#x27;}&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;${tournament()&amp;&amp;s.started?`&lt;p class=&quot;arena-small&quot; style=&quot;margin-top:10px&quot;&gt;配点人数 N=${s.fixedN||s.people}（固定）&lt;/p&gt;`:&#x27;&#x27;}&lt;/section&gt;${s.phase===&#x27;lobby&#x27;?`&lt;details&gt;&lt;summary&gt;招待情報&lt;/summary&gt;&lt;p style=&quot;margin-top:10px&quot;&gt;開催ID EV8DEMO2&lt;br&gt;参加コード K8PLAY22&lt;/p&gt;${button(&#x27;招待情報を表示&#x27;,&#x27;invite&#x27;)}&lt;span class=&quot;arena-small&quot;&gt;専任Hostにはプレー連携は不要です。&lt;/span&gt;&lt;/details&gt;`:&#x27;&#x27;}${management?`&lt;details class=&quot;arena-admin&quot;&gt;&lt;summary&gt;開催の管理&lt;/summary&gt;&lt;div class=&quot;arena-actions&quot;&gt;${management}&lt;/div&gt;&lt;/details&gt;`:&#x27;&#x27;}${skip?`&lt;div class=&quot;arena-actions&quot;&gt;${skip}&lt;/div&gt;`:&#x27;&#x27;}${!host()&amp;&amp;!ended?button(&#x27;開催から退出&#x27;,&#x27;leave&#x27;,&#x27;subtle&#x27;,s.hostLost||s.selfLost):ended?button(&#x27;開催の入口へ&#x27;,&#x27;entry&#x27;,&#x27;subtle&#x27;):&#x27;&#x27;}&lt;/aside&gt;`;
  }
  function gamePodium(){
    if(s.detail)return &#x27;&#x27;;
    const overallView=tournament()&amp;&amp;(s.phase===&#x27;final&#x27;||s.resultTab===&#x27;overall&#x27;);
    if(!s.rounds.some(r=&gt;!r.invalid)&amp;&amp;s.phase===&#x27;final&#x27;)return &#x27;&#x27;;
    const round=s.rounds.at(-1);
    if(!round||round.invalid&amp;&amp;!overallView)return &#x27;&#x27;;
    const entries=overallView?overall():round.entries;
    const selectedEntries=entries.slice(0,3),own=entries.find(e=&gt;e.id===selfIndex());
    if(plays()&amp;&amp;own&amp;&amp;!selectedEntries.some(e=&gt;e.id===own.id))selectedEntries.push(own);
    return `&lt;div class=&quot;arena-scorecards ${selectedEntries.length===4?&#x27;with-self&#x27;:&#x27;&#x27;}&quot; aria-label=&quot;${overallView?&#x27;総合&#x27;:&#x27;曲別&#x27;}順位カード&quot;&gt;${selectedEntries.map(e=&gt;`&lt;article class=&quot;arena-scorecard ${e.rank===1?&#x27;winner&#x27;:&#x27;&#x27;} ${plays()&amp;&amp;e.id===selfIndex()?&#x27;self&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;arena-avatar&quot;&gt;${icon(&#x27;user&#x27;)}&lt;/span&gt;&lt;div class=&quot;arena-big-rank&quot;&gt;${e.rank?e.rank+&#x27;位&#x27;:&#x27;欠場&#x27;}&lt;/div&gt;&lt;strong class=&quot;arena-dj-name&quot;&gt;${esc(e.name.replace(&#x27;（あなた）&#x27;,&#x27;&#x27;))}&lt;/strong&gt;${plays()&amp;&amp;e.id===selfIndex()?&#x27;&lt;small&gt;あなた&lt;/small&gt;&#x27;:&#x27;&#x27;}&lt;small&gt;${overallView?&#x27;総合ポイント&#x27;:s.metric}&lt;/small&gt;&lt;div class=&quot;arena-big-score&quot;&gt;${overallView?e.points+&#x27;pt&#x27;:e.score}&lt;/div&gt;${tournament()&amp;&amp;!overallView?`&lt;span class=&quot;arena-points&quot;&gt;+${e.points}pt&lt;/span&gt;`:&#x27;&#x27;}${e.absence?`&lt;small&gt;${esc(e.absence)}・欠場値&lt;/small&gt;`:&#x27;&#x27;}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
  }
  function gameResults(){
    const tabs=tournament()&amp;&amp;s.phase===&#x27;round&#x27;&amp;&amp;!s.detail?`&lt;div class=&quot;arena-result-tabs&quot;&gt;${button(&#x27;曲別結果&#x27;,&#x27;round-tab&#x27;,s.resultTab===&#x27;round&#x27;?&#x27;primary&#x27;:&#x27;&#x27;)}${button(&#x27;ここまでの総合&#x27;,&#x27;overall-tab&#x27;,s.resultTab===&#x27;overall&#x27;?&#x27;primary&#x27;:&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;;
    return `${s.detail?button(&#x27;前の画面に戻る&#x27;,&#x27;close-detail&#x27;,&#x27;subtle&#x27;):&#x27;&#x27;}${tabs}${gamePodium()}${resultContent()}`;
  }
  function room(){
    const ended=s.phase===&#x27;final&#x27;;
    const heading=`&lt;div class=&quot;arena-room-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;${esc(s.name||typeLabel()+&#x27; &#x27;+s.style)}&lt;/h1&gt;&lt;span class=&quot;arena-small&quot;&gt;${typeLabel()} · ${roleLabel()}${s.role===&#x27;host-only&#x27;?&#x27;（プレーしません）&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;${ended?&#x27;&lt;span class=&quot;arena-small&quot;&gt;開催終了&lt;/span&gt;&#x27;:`&lt;span class=&quot;arena-small&quot;&gt;招待制 · 最大20人&lt;/span&gt;`}&lt;/div&gt;`;
    const lost=s.hostLost?banner(&#x27;Host再接続待ち · 残り 04:32。自動提出は継続できます。結果確定・開始・スキップ・退出は再接続後。&#x27;,&#x27;warning&#x27;):&#x27;&#x27;;
    const disconnectNotice=host()&amp;&amp;s.disconnectedIds.length&amp;&amp;!ended&amp;&amp;!s.detail?banner(`切断中：${s.disconnectedIds.length}人。${s.phase===&#x27;round&#x27;?&#x27;席を保持しています。確定済みの結果は変わらず、次の曲にも参加対象として残ります。&#x27;:&#x27;席と参加対象を保持しています。通話で確認し、待つか進めるか判断してください。&#x27;}`,&#x27;warning&#x27;):&#x27;&#x27;;
    const progress=[&#x27;round&#x27;,&#x27;final&#x27;].includes(s.phase)||s.detail?&#x27;&#x27;:`&lt;div class=&quot;arena-progress-line&quot;&gt;&lt;strong&gt;${stats()}&lt;/strong&gt;&lt;span class=&quot;arena-small&quot;&gt;${s.phase===&#x27;ready&#x27;?&#x27;ゲーム内で準備 · Hostが開始&#x27;:s.phase===&#x27;play&#x27;?&#x27;自動提出 · スコアは確定後に公開&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;`;
    const picker=s.phase===&#x27;picking&#x27;&amp;&amp;host()&amp;&amp;s.pickerOpen?pickPanel():&#x27;&#x27;;
    const viewResult=[&#x27;round&#x27;,&#x27;final&#x27;].includes(s.phase)||s.detail;
    const content=viewResult?gameResults():`${picker}${gameSelfNote()}${gamePlayers()}`;
    return `${heading}${lost}${disconnectNotice}${s.notice?banner(esc(s.notice)):&#x27;&#x27;}&lt;div class=&quot;arena-room-layout&quot;&gt;&lt;div class=&quot;arena-playfield&quot;&gt;${stageHead()}${progress}${content}${s.detail?&#x27;&#x27;:gameActionBar()}&lt;/div&gt;${gameHud()}&lt;/div&gt;`;
  }
  function pickPanel(){
    return `&lt;section class=&quot;arena-search-panel&quot;&gt;&lt;header&gt;&lt;strong&gt;${icon(&#x27;music-2&#x27;)} PICK MUSIC&lt;/strong&gt;${button(&#x27;閉じる&#x27;,&#x27;close-picker&#x27;,&#x27;subtle&#x27;)}&lt;/header&gt;&lt;div class=&quot;arena-search-body&quot;&gt;&lt;input id=&quot;ef-search&quot; aria-label=&quot;曲を検索&quot; placeholder=&quot;曲名で検索&quot; value=&quot;${esc(s.search)}&quot;&gt;&lt;p class=&quot;arena-small&quot; style=&quot;margin-top:8px&quot;&gt;参加者全員の所持・解禁条件に合う譜面&lt;/p&gt;${s.noCommon?banner(&#x27;共通する譜面がありません。切断中の参加者を含めて所持・解禁条件を確認してください。&#x27;,&#x27;warning&#x27;):`&lt;div class=&quot;arena-charts&quot;&gt;${charts.filter(c=&gt;c.title.toLowerCase().includes(s.search.toLowerCase())).map(c=&gt;`&lt;button type=&quot;button&quot; class=&quot;arena-chart cursor-interaction&quot; data-act=&quot;pick&quot; data-chart=&quot;${c.id}&quot; aria-pressed=&quot;${s.candidate===c.id}&quot;&gt;&lt;span class=&quot;arena-chart-thumb&quot;&gt;${icon(&#x27;music&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${esc(c.title)}&lt;/strong&gt;&lt;span class=&quot;arena-small&quot;&gt;${s.style} · ${c.difficulty}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;arena-level&quot;&gt;Lv${c.level}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${s.candidate?`&lt;div class=&quot;arena-actions&quot;&gt;${button(&#x27;この譜面を確定する&#x27;,&#x27;confirm-pick&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}`}&lt;/div&gt;&lt;/section&gt;`;
  }
  function entry(){
    return `&lt;div class=&quot;arena-entry-title&quot;&gt;&lt;div&gt;${icon(&#x27;users&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;arena-small&quot;&gt;INFINITAS ARENA · EVENT&lt;/div&gt;&lt;h1&gt;合同プレー・大会&lt;/h1&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;arena-muted&quot;&gt;招待された仲間と、Hostの選曲で遊ぼう。&lt;/p&gt;${s.joined&amp;&amp;s.phase!==&#x27;final&#x27;?banner(`&lt;div class=&quot;arena-row&quot;&gt;&lt;span&gt;参加中：${esc(s.name)}&lt;br&gt;&lt;small&gt;第${s.round}曲 · ${stageLabel()}&lt;/small&gt;&lt;/span&gt;${button(&#x27;開催へ戻る&#x27;,&#x27;room&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;`,&#x27;return&#x27;):&#x27;&#x27;}${s.left?banner(&#x27;以前の開催から退出しています。復帰は次に選曲確定する曲から。&#x27;+actions(button(&#x27;以前の開催へ復帰する&#x27;,&#x27;return&#x27;,&#x27;primary&#x27;)),&#x27;warning&#x27;):&#x27;&#x27;}${s.condition===&#x27;not-supported&#x27;?banner(&#x27;接続先は開催に対応していません。通常対戦は利用できます。&#x27;,&#x27;warning&#x27;):&#x27;&#x27;}${s.notice?banner(esc(s.notice)):&#x27;&#x27;}&lt;div class=&quot;arena-entry-grid&quot;&gt;&lt;section class=&quot;arena-panel&quot;&gt;${icon(&#x27;ticket&#x27;)}&lt;h2&gt;招待から参加&lt;/h2&gt;&lt;p class=&quot;arena-muted&quot;&gt;Hostから受け取った情報で入室します。&lt;/p&gt;${button(&#x27;招待情報を入力して参加&#x27;,&#x27;join&#x27;,&#x27;primary&#x27;,s.condition===&#x27;not-supported&#x27;)}&lt;/section&gt;&lt;section class=&quot;arena-panel&quot;&gt;${icon(&#x27;flag&#x27;)}&lt;h2&gt;みんなで遊ぶ場を作る&lt;/h2&gt;&lt;p class=&quot;arena-muted&quot;&gt;合同プレー、またはポイントを競う大会。Hostはプレー兼任・進行専任を選べます。&lt;/p&gt;${button(&#x27;開催を作る&#x27;,&#x27;create&#x27;,&#x27;primary&#x27;,s.condition===&#x27;not-supported&#x27;)}&lt;/section&gt;&lt;/div&gt;&lt;hr class=&quot;arena-divider&quot;&gt;&lt;div class=&quot;arena-row&quot;&gt;&lt;span class=&quot;arena-small&quot;&gt;この端末に残した曲と結果&lt;/span&gt;${button(&#x27;開催履歴を見る&#x27;,&#x27;history&#x27;,&#x27;subtle&#x27;)}&lt;/div&gt;`;
  }

  function lobbyInfo(){return `&lt;section class=&quot;arena-panel&quot;&gt;&lt;h2&gt;参加者が集まるまで待機&lt;/h2&gt;&lt;p&gt;${tournament()?&#x27;開催開始で名簿と配点人数が固定されます。開始後は新規参加できません。&#x27;:&#x27;途中参加できます。選曲確定後に来た人は次の曲から参加します。&#x27;}&lt;/p&gt;&lt;div class=&quot;arena-small&quot;&gt;Host：DJ HOST · ${s.role===&#x27;host-player&#x27;?&#x27;プレー兼任&#x27;:&#x27;進行専任&#x27;}&lt;/div&gt;&lt;hr class=&quot;arena-divider&quot;&gt;&lt;h3&gt;招待情報&lt;/h3&gt;&lt;p&gt;開催ID：EV8DEMO2&lt;br&gt;参加コード：K8PLAY22&lt;/p&gt;${button(&#x27;招待情報を表示&#x27;,&#x27;invite&#x27;)}&lt;p class=&quot;arena-small&quot; style=&quot;margin-top:12px&quot;&gt;${plays()?&#x27;連携ツール：接続中。所持・解禁条件を使って共通譜面を選びます。&#x27;:&#x27;専任Hostには連携ツールの設定は不要です。&#x27;}&lt;/p&gt;&lt;/section&gt;`;}
  function playHelp(){if(s.phase===&#x27;ready&#x27;)return &#x27;&#x27;;return `&lt;section class=&quot;arena-panel&quot;&gt;&lt;h2&gt;プレー・提出&lt;/h2&gt;&lt;p class=&quot;arena-muted&quot;&gt;${s.casualWait||s.nextWait?&#x27;自分はこの曲の提出対象ではありません。&#x27;:&#x27;曲名・難易度を確認してプレーしてください。厳密な同時スタートは必要ありません。&#x27;}&lt;/p&gt;&lt;p class=&quot;arena-small&quot;&gt;進行中のスコアや順位は、Hostにも表示されません。&lt;/p&gt;&lt;/section&gt;`;}
  function resultSection(){return `${s.detail?button(&#x27;結果の概要に戻る&#x27;,&#x27;close-detail&#x27;,&#x27;subtle&#x27;):&#x27;&#x27;}${tournament()&amp;&amp;s.phase===&#x27;round&#x27;?actions(button(&#x27;曲別結果&#x27;,&#x27;round-tab&#x27;,s.resultTab===&#x27;round&#x27;?&#x27;primary&#x27;:&#x27;&#x27;)+button(&#x27;ここまでの総合&#x27;,&#x27;overall-tab&#x27;,s.resultTab===&#x27;overall&#x27;?&#x27;primary&#x27;:&#x27;&#x27;)):&#x27;&#x27;}${resultContent()}`;}
  function create(){return `&lt;button type=&quot;button&quot; class=&quot;arena-back cursor-interaction&quot; data-act=&quot;entry&quot;&gt;← 合同・大会へ&lt;/button&gt;&lt;h1&gt;開催の待機室を作る&lt;/h1&gt;&lt;p class=&quot;arena-muted&quot;&gt;設定して招待します。開催の開始は、参加者が集まってから操作します。&lt;/p&gt;&lt;form id=&quot;ef-create-form&quot; class=&quot;arena-panel&quot;&gt;&lt;label&gt;開催名&lt;input name=&quot;name&quot; value=&quot;${esc(s.name)}&quot; maxlength=&quot;80&quot; placeholder=&quot;空欄でも作成できます&quot;&gt;&lt;/label&gt;&lt;div class=&quot;arena-form-grid&quot;&gt;&lt;label&gt;開催タイプ&lt;select name=&quot;kind&quot;&gt;&lt;option value=&quot;casual&quot; ${!tournament()?&#x27;selected&#x27;:&#x27;&#x27;}&gt;合同プレー&lt;/option&gt;&lt;option value=&quot;tournament&quot; ${tournament()?&#x27;selected&#x27;:&#x27;&#x27;}&gt;大会&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Hostの役割&lt;select name=&quot;role&quot;&gt;&lt;option value=&quot;host-only&quot; ${s.role===&#x27;host-only&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;進行専任（プレーしない）&lt;/option&gt;&lt;option value=&quot;host-player&quot; ${s.role===&#x27;host-player&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;プレー兼任&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;プレースタイル&lt;select name=&quot;style&quot;&gt;&lt;option&gt;SP&lt;/option&gt;&lt;option ${s.style===&#x27;DP&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;DP&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;結果の指標&lt;select name=&quot;metric&quot;&gt;&lt;option&gt;EX SCORE&lt;/option&gt;&lt;option ${s.metric===&#x27;MISS COUNT&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;MISS COUNT&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div id=&quot;ef-create-note&quot; class=&quot;arena-banner&quot; style=&quot;margin-top:15px&quot;&gt;${typeNote()}&lt;/div&gt;&lt;p class=&quot;arena-small&quot;&gt;招待制・参加コードは自動生成。専任Hostは連携ツール不要、兼任Hostはプレー用の設定が必要です。&lt;/p&gt;&lt;div class=&quot;arena-actions&quot;&gt;&lt;button type=&quot;button&quot; data-act=&quot;submit-local&quot; class=&quot;arena-button primary cursor-interaction&quot;&gt;待機室を作る&lt;/button&gt;${button(&#x27;キャンセル&#x27;,&#x27;entry&#x27;)}&lt;/div&gt;&lt;/form&gt;`;}
  function typeNote(){return tournament()?&#x27;大会：開催開始時に参加者と配点人数を固定します。途中の新規参加は不可。曲別順位と総合ポイントを表示します。&#x27;:&#x27;合同プレー：途中参加できます。曲別順位を表示し、総合順位・ポイントは集計しません。&#x27;;}
  function join(){const err=s.error;return `&lt;button type=&quot;button&quot; class=&quot;arena-back cursor-interaction&quot; data-act=&quot;entry&quot;&gt;← 合同・大会へ&lt;/button&gt;&lt;h1&gt;開催に参加する&lt;/h1&gt;&lt;p class=&quot;arena-muted&quot;&gt;Hostから受け取った開催IDと参加コードを入力してください。&lt;/p&gt;&lt;form id=&quot;ef-join-form&quot; class=&quot;arena-panel&quot;&gt;&lt;label&gt;開催ID&lt;input name=&quot;roomId&quot; value=&quot;${esc(s.joinId)}&quot; placeholder=&quot;EV8DEMO2&quot; required&gt;&lt;/label&gt;&lt;label&gt;参加コード&lt;input name=&quot;joinCode&quot; value=&quot;${esc(s.joinCode)}&quot; placeholder=&quot;K8PLAY22&quot; maxlength=&quot;8&quot; required&gt;&lt;/label&gt;${err?`&lt;div role=&quot;alert&quot; class=&quot;arena-banner warning&quot;&gt;${esc(err)}&lt;/div&gt;`:&#x27;&#x27;}&lt;p class=&quot;arena-small&quot;&gt;プレー参加にはDJ NAME・連携ツールの設定が必要です。招待された開催にだけ入室できます。&lt;/p&gt;&lt;div class=&quot;arena-actions&quot;&gt;&lt;button type=&quot;button&quot; data-act=&quot;submit-local&quot; class=&quot;arena-button primary cursor-interaction&quot;&gt;開催に参加する&lt;/button&gt;${button(&#x27;サンプルの招待情報を入れる&#x27;,&#x27;sample-invite&#x27;)}&lt;/div&gt;&lt;/form&gt;`;}
  function history(){const mode=s.historyMode;return `&lt;h1&gt;開催履歴&lt;/h1&gt;&lt;p class=&quot;arena-muted&quot;&gt;この端末に受信・保存した開催です。通常対戦の成績には含まれません。&lt;/p&gt;${s.detail?button(&#x27;開催履歴の一覧へ&#x27;,&#x27;history-list&#x27;,&#x27;subtle&#x27;):&#x27;&#x27;}${mode===&#x27;empty&#x27;?`&lt;section class=&quot;arena-panel&quot;&gt;&lt;h2&gt;開催履歴はありません&lt;/h2&gt;&lt;p class=&quot;arena-muted&quot;&gt;合同プレー・大会に参加すると、公開された結果がここに残ります。&lt;/p&gt;${button(&#x27;合同・大会へ&#x27;,&#x27;entry&#x27;,&#x27;primary&#x27;)}&lt;/section&gt;`:mode===&#x27;unknown&#x27;?banner(&#x27;未対応バージョンの開催履歴です。読み取れませんが、元のデータは保持しています。&#x27;,&#x27;warning&#x27;):s.detail?`${mode===&#x27;partial&#x27;?banner(&#x27;部分履歴：最後に受信した第1曲まで。開催終了後の結果は未受信です。最終受信：2026/10/04 20:15。&#x27;,&#x27;warning&#x27;):banner(&#x27;完全な履歴：終了結果と全公開曲を受信済み&#x27;)}&lt;div class=&quot;arena-heading&quot;&gt;&lt;div&gt;&lt;h2&gt;${esc(s.name)}&lt;/h2&gt;&lt;span class=&quot;arena-small&quot;&gt;${typeLabel()} · ${s.style} · ${s.metric}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;${tournament()?table(overall(),true):&#x27;&#x27;}${s.rounds.map(r=&gt;`&lt;section class=&quot;arena-panel&quot; style=&quot;margin-top:14px&quot;&gt;&lt;h2&gt;第${r.number}曲 ${esc(r.chart.title)}${r.invalid?&#x27;・無効&#x27;:&#x27;&#x27;}&lt;/h2&gt;${r.invalid?&#x27;&lt;p class=&quot;arena-small&quot;&gt;総合から除外。記録は残しています。&lt;/p&gt;&#x27;:&#x27;&#x27;}${table(r.entries)}&lt;/section&gt;`).join(&#x27;&#x27;)}`:`${mode===&#x27;partial&#x27;?banner(&#x27;一部のみ受信した開催があります。未受信の結果を後日取得する保証はありません。&#x27;,&#x27;warning&#x27;):&#x27;&#x27;}&lt;button type=&quot;button&quot; class=&quot;arena-history-item cursor-interaction&quot; data-act=&quot;history-detail&quot;&gt;&lt;strong&gt;${esc(s.name)}&lt;/strong&gt;&lt;span class=&quot;arena-small&quot;&gt;2026/10/04 · ${typeLabel()} · ${s.rounds.length}曲受信 · ${mode===&#x27;partial&#x27;?&#x27;部分&#x27;:&#x27;完全&#x27;}&lt;/span&gt;&lt;/button&gt;`}`;}
  function normal(){return `&lt;h1&gt;対戦ロビーを探す&lt;/h1&gt;&lt;p class=&quot;arena-muted&quot;&gt;公開中の通常対戦に参加できます。&lt;/p&gt;${s.joined&amp;&amp;s.phase!==&#x27;final&#x27;?banner(`&lt;div class=&quot;arena-row&quot;&gt;&lt;div&gt;開催に参加中です&lt;div class=&quot;arena-small&quot;&gt;画面移動は退出になりません。通常対戦への同時参加はできません。&lt;/div&gt;&lt;/div&gt;${button(&#x27;開催へ戻る&#x27;,&#x27;room&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;`,&#x27;return&#x27;):&#x27;&#x27;}&lt;div class=&quot;arena-actions&quot;&gt;${button(&#x27;自動対戦&#x27;,&#x27;normal-reference&#x27;,&#x27;primary&#x27;,s.joined&amp;&amp;s.phase!==&#x27;final&#x27;)}${button(&#x27;ルームを作る&#x27;,&#x27;normal-reference&#x27;,&#x27;&#x27;,s.joined&amp;&amp;s.phase!==&#x27;final&#x27;)}${button(&#x27;IDで参加&#x27;,&#x27;normal-reference&#x27;,&#x27;&#x27;,s.joined&amp;&amp;s.phase!==&#x27;final&#x27;)}&lt;/div&gt;&lt;hr class=&quot;arena-divider&quot;&gt;&lt;section class=&quot;arena-panel&quot;&gt;&lt;div class=&quot;arena-row&quot;&gt;&lt;div&gt;&lt;h2&gt;Lv12を遊びましょう&lt;/h2&gt;&lt;span class=&quot;arena-small&quot;&gt;ARENA · SP · EX SCORE · 1 / 2人&lt;/span&gt;&lt;/div&gt;${button(&#x27;参加&#x27;,&#x27;normal-reference&#x27;,&#x27;&#x27;,s.joined&amp;&amp;s.phase!==&#x27;final&#x27;)}&lt;/div&gt;&lt;/section&gt;`;}
  function render(){
    if(![&#x27;entry&#x27;,&#x27;normal&#x27;,&#x27;create&#x27;,&#x27;join&#x27;,&#x27;room&#x27;,&#x27;history&#x27;,&#x27;reference&#x27;,&#x27;settings&#x27;].includes(s.view))s.view=&#x27;entry&#x27;;
    root.querySelector(&#x27;.arena-side&#x27;).innerHTML=[[&#x27;normal&#x27;,&#x27;通常対戦&#x27;,&#x27;home&#x27;],[&#x27;entry&#x27;,&#x27;合同・大会&#x27;,&#x27;users&#x27;],[&#x27;stats&#x27;,&#x27;成績&#x27;,&#x27;chart-no-axes-column&#x27;],[&#x27;match-history&#x27;,&#x27;対戦履歴&#x27;,&#x27;history&#x27;],[&#x27;history&#x27;,&#x27;開催履歴&#x27;,&#x27;calendar-clock&#x27;]].map(([act,label,glyph])=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-act=&quot;${act}&quot; ${s.view===act||(act===&#x27;entry&#x27;&amp;&amp;[&#x27;room&#x27;,&#x27;create&#x27;,&#x27;join&#x27;].includes(s.view))?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;${icon(glyph)}&lt;span&gt;${label}&lt;/span&gt;&lt;/button&gt;${act===&#x27;entry&#x27;&amp;&amp;s.joined&amp;&amp;s.phase!==&#x27;final&#x27;?`&lt;button type=&quot;button&quot; class=&quot;arena-active-event cursor-interaction&quot; data-act=&quot;room&quot;&gt;${icon(&#x27;gamepad-2&#x27;)}&lt;span&gt;開催へ戻る&lt;/span&gt;&lt;/button&gt;`:&#x27;&#x27;}`).join(&#x27;&#x27;)+`&lt;button type=&quot;button&quot; class=&quot;arena-settings cursor-interaction&quot; data-act=&quot;settings&quot;&gt;${icon(&#x27;settings&#x27;)}&lt;span&gt;設定&lt;/span&gt;&lt;/button&gt;`;
    main.innerHTML=({normal,entry,create,join,room,history,reference:()=&gt;`&lt;h1&gt;${esc(s.referenceTitle||&#x27;通常対戦&#x27;)}&lt;/h1&gt;&lt;section class=&quot;arena-reference&quot;&gt;&lt;p class=&quot;arena-muted&quot;&gt;通常対戦は従来の専用画面へ進みます。この試作では、開催への導線を確認できます。&lt;/p&gt;${button(&#x27;通常対戦のTopへ&#x27;,&#x27;normal&#x27;)}&lt;/section&gt;`,settings:()=&gt;`&lt;h1&gt;設定&lt;/h1&gt;&lt;section class=&quot;arena-panel&quot;&gt;&lt;h2&gt;DJ SAMPLE&lt;/h2&gt;&lt;p&gt;プレー用連携ツール：接続中&lt;br&gt;所持パック・BIT/DJP解禁：設定済み&lt;/p&gt;&lt;p class=&quot;arena-muted&quot;&gt;開催専任HostはDJ NAMEで利用できます。プレーする人は連携設定が必要です。&lt;/p&gt;${button(s.joined?&#x27;進行中の開催へ戻る&#x27;:&#x27;合同・大会へ&#x27;,s.joined?&#x27;room&#x27;:&#x27;entry&#x27;)}&lt;/section&gt;`})[s.view]();
    roleControl.value=s.role;kindControl.value=s.kind;sceneControl.value=s.view===&#x27;room&#x27;?s.phase:s.view===&#x27;reference&#x27;||s.view===&#x27;settings&#x27;?&#x27;normal&#x27;:s.view;caseControl.value=s.condition;
    root.querySelector(&#x27;#ef-simulate&#x27;).disabled=s.view!==&#x27;room&#x27;||![&#x27;ready&#x27;,&#x27;play&#x27;].includes(s.phase)||s.selfLost||(s.phase===&#x27;ready&#x27;&amp;&amp;(host()||!!startBlock()));
    const caseNote=root.querySelector(&#x27;#ef-case-note&#x27;);caseNote.hidden=s.reviewRestIds.length===0;caseNote.textContent=s.reviewRestIds.length?&#x27;レビュー用：PLAYER 03が通話で休憩を申告した想定。アプリは休憩状態を自動判定せず、提出前は未提出として表示します。&#x27;:&#x27;&#x27;;
    root.querySelector(&#x27;#ef-return-peer&#x27;).disabled=!s.disconnectedIds.length;
    root.querySelector(&#x27;#ef-simulate&#x27;).textContent=s.hostLost&amp;&amp;s.submissionsComplete?&#x27;Hostの期限前の復帰を再現&#x27;:s.sourceFail?&#x27;連携ツールの復旧・提出を再現&#x27;:s.disconnectedIds.length||s.reviewRestIds.length?&#x27;接続中・プレーした人の提出を再現&#x27;:&#x27;Hostの開始・自動提出を再現&#x27;;
    if(window.lucide)lucide.createIcons({attrs:{width:18,height:18}});
    root.querySelectorAll(&#x27;.arena-sim button&#x27;).forEach(e=&gt;e.classList.add(&#x27;cursor-interaction&#x27;));
    root.querySelector(&#x27;#ef-live&#x27;).textContent=`${roleLabel()}。${s.view===&#x27;room&#x27;?stageLabel():main.querySelector(&#x27;h1&#x27;)?.textContent||&#x27;&#x27;}。${s.notice}`;
  }
  function save(){const state={...s,pendingConfirmation:null,error:&#x27;&#x27;};const privateContent=new TextEncoder().encode(JSON.stringify(state)).length&lt;14000?{version:4,state}:{version:4,state:{role:s.role,kind:s.kind,name:s.name,view:&#x27;entry&#x27;}};window.openai?.setWidgetState?.({modelContent:{入口:&#x27;専用ページ&#x27;,立場:roleLabel(),タイプ:typeLabel(),場面:stageLabel(),状態:s.condition},privateContent})?.catch(()=&gt;{});}
  function confirm(title,text,act,data={}){s.pendingConfirmation={act,data};root.querySelector(&#x27;#ef-dialog-content&#x27;).innerHTML=`&lt;h2 id=&quot;ef-dialog-title&quot;&gt;${esc(title)}&lt;/h2&gt;&lt;p&gt;${esc(text)}&lt;/p&gt;${actions(button(&#x27;キャンセル&#x27;,&#x27;cancel-confirm&#x27;)+button(&#x27;確認して実行&#x27;,&#x27;accept-confirm&#x27;,&#x27;danger&#x27;))}`;dialog.showModal();}

  function request(act,el){
    if([&#x27;open-picker&#x27;,&#x27;pick&#x27;,&#x27;confirm-pick&#x27;,&#x27;start-event&#x27;,&#x27;start-round&#x27;,&#x27;reselect&#x27;,&#x27;skip&#x27;,&#x27;deadline&#x27;,&#x27;invalidate&#x27;,&#x27;next&#x27;,&#x27;end&#x27;,&#x27;leave&#x27;,&#x27;kick&#x27;,&#x27;obsolete-action&#x27;].includes(act)&amp;&amp;(s.hostLost||s.selfLost))return;
    if(act===&#x27;start-event&#x27;&amp;&amp;tournament())return confirm(&#x27;この人数で大会を開始しますか？&#x27;,`${total()}人の名簿と配点人数を固定します。このあと新しい参加者は追加できません。`,&#x27;start-event&#x27;);
    if(act===&#x27;reselect&#x27;)return confirm(&#x27;譜面を選び直しますか？&#x27;,&#x27;確定した譜面を取り消し、選曲へ戻ります。新しい譜面は通話・配信で共有してください。&#x27;,&#x27;reselect&#x27;);
    if(act===&#x27;skip&#x27;)return confirm(&#x27;この曲をスキップしますか？&#x27;,`この曲は欠場（スキップ）になります。${tournament()?&#x27;大会ポイントは0ptです。&#x27;:&#x27;&#x27;}あとから結果を提出できません。`,&#x27;skip&#x27;);
    if(act===&#x27;deadline&#x27;)return confirm(&#x27;未提出の人を締め切りますか？&#x27;,`未提出の${pendingIds().length}人を欠場として確定します。締切後の提出は受け付けません。`,&#x27;deadline&#x27;);
    if(act===&#x27;invalidate&#x27;){const number=Number(el?.dataset.round)||s.round;const round=s.rounds.find(r=&gt;r.number===number);return confirm(`第${number}曲「${round?.chart.title||selected().title}」を無効にしますか？`,&#x27;全員の総合集計から除外します。曲と無効の記録は開催履歴に残ります。&#x27;,&#x27;invalidate&#x27;,{number});}
    if(act===&#x27;end&#x27;)return confirm(&#x27;開催を終了しますか？&#x27;,s.phase===&#x27;play&#x27;?&#x27;進行中の未確定曲は無効になります。確定済みの曲だけを最終結果に残します。&#x27;:&#x27;次の曲には進めなくなります。確定した結果は開催履歴に残ります。&#x27;,&#x27;end&#x27;);
    if(act===&#x27;leave&#x27;)return confirm(&#x27;開催から退出しますか？&#x27;,`提出済みの結果は残ります。復帰は次に選曲確定する曲からです。${tournament()?&#x27;不在の曲は欠場・0ptになります。&#x27;:&#x27;&#x27;}`,&#x27;leave&#x27;);
    if(act===&#x27;kick&#x27;){const person=Number(el.dataset.person);return confirm(`${displayName(person)}をKickしますか？`,&#x27;この開催には再参加できません。確定済み・提出済みの結果は残し、未提出なら欠場になります。&#x27;,&#x27;kick&#x27;,{person});}
    apply(act,el?.dataset||{});
  }
  function apply(act,data={}){
    s.notice=&#x27;&#x27;;s.error=&#x27;&#x27;;
    if([&#x27;normal&#x27;,&#x27;entry&#x27;,&#x27;create&#x27;,&#x27;join&#x27;,&#x27;room&#x27;,&#x27;history&#x27;,&#x27;settings&#x27;].includes(act)){s.view=act;if(act===&#x27;history&#x27;){s.detail=false;if(!s.rounds.length&amp;&amp;s.historyMode===&#x27;complete&#x27;)s.historyMode=&#x27;empty&#x27;;}if(act===&#x27;create&#x27;&amp;&amp;s.role===&#x27;player&#x27;)s.role=&#x27;host-only&#x27;;}
    else if([&#x27;normal-reference&#x27;,&#x27;stats&#x27;,&#x27;match-history&#x27;].includes(act)){s.view=&#x27;reference&#x27;;s.referenceTitle=act===&#x27;stats&#x27;?&#x27;通常対戦の成績&#x27;:act===&#x27;match-history&#x27;?&#x27;通常対戦の履歴&#x27;:&#x27;通常対戦&#x27;;}
    else if(act===&#x27;sample-invite&#x27;){s.joinId=&#x27;EV8DEMO2&#x27;;s.joinCode=&#x27;K8PLAY22&#x27;;}
    else if(act===&#x27;start-event&#x27;){if(total()===0)return;s.started=true;s.fixedRoster=tournament()?eligible():null;s.fixedN=tournament()?s.fixedRoster.length:null;s.phase=&#x27;picking&#x27;;}
    else if(act===&#x27;pick&#x27;)s.candidate=data.chart;
    else if(act===&#x27;open-picker&#x27;){s.pickerOpen=true;}
    else if(act===&#x27;close-picker&#x27;){s.pickerOpen=false;}
    else if(act===&#x27;view-round&#x27;){s.returnPhase=s.phase;s.detail=Number(data.round);}
    else if(act===&#x27;confirm-pick&#x27;){s.pickerOpen=false;if(!s.candidate)return;s.chart=charts.find(c=&gt;c.id===s.candidate);s.phase=&#x27;ready&#x27;;s.selfReady=false;}
    else if(act===&#x27;start-round&#x27;){if(startBlock())return;s.playingIds=eligible();s.phase=&#x27;play&#x27;;s.casualWait=false;s.selfStatus=&#x27;pending&#x27;;s.submitted=0;s.submittedIds=[];s.detail=false;s.submissionsComplete=false;s.absences=[];}
    else if(act===&#x27;reselect&#x27;){s.phase=&#x27;picking&#x27;;s.pickerOpen=false;s.chart=null;s.candidate=null;s.ready=0;s.selfReady=false;}
    else if(act===&#x27;simulate&#x27;){
      if(s.phase===&#x27;ready&#x27;){
        if(host()||startBlock()||s.selfLost)return;
        s.playingIds=eligible();s.phase=&#x27;play&#x27;;s.selfStatus=&#x27;pending&#x27;;s.submitted=0;s.submittedIds=[];s.absences=[];
        s.notice=&#x27;Hostが通話等で確認し、この曲を開始した状態です。&#x27;;
      }else if(s.phase===&#x27;play&#x27;){
        if(s.hostLost&amp;&amp;s.submissionsComplete){s.hostLost=false;s.condition=&#x27;standard&#x27;;s.notice=&#x27;Hostが期限前に復帰しました。全員完了の曲を確定しました。&#x27;;publish();}
        else{
          s.sourceFail=false;
          const unavailable=new Set([...s.disconnectedIds,...s.reviewRestIds]);
          s.submittedIds=playing().filter(id=&gt;!unavailable.has(id)&amp;&amp;!(plays()&amp;&amp;id===selfIndex())&amp;&amp;!s.kicked.includes(id));
          s.submitted=s.submittedIds.length;
          if(activeSelf()&amp;&amp;s.selfStatus!==&#x27;absent&#x27;&amp;&amp;!unavailable.has(selfIndex()))s.selfStatus=&#x27;submitted&#x27;;
          s.submissionsComplete=pendingIds().length===0;
          if(s.submissionsComplete&amp;&amp;!s.hostLost)publish();
          else s.notice=s.hostLost?&#x27;提出を受け付けました。結果確定はHostの復帰を待っています。&#x27;:`未提出 ${pendingIds().length}人。Hostが待つか締め切るか判断します。まだ欠場は確定していません。`;
        }
      }
    }
    else if(act===&#x27;review-reconnect&#x27;){s.disconnectedIds=[];s.condition=&#x27;standard&#x27;;s.notice=&#x27;参加者が同じ席・同じ曲へ復帰した状態です。曲が締切済みなら、その曲へは提出できません。&#x27;;}
    else if(act===&#x27;skip&#x27;){s.selfStatus=&#x27;absent&#x27;;s.selfReason=&#x27;スキップ&#x27;;}
    else if(act===&#x27;deadline&#x27;){s.absences=pendingIds().map(id=&gt;({id,reason:&#x27;未提出のまま締切&#x27;}));if(s.absences.some(a=&gt;plays()&amp;&amp;a.id===selfIndex())){s.selfStatus=&#x27;absent&#x27;;s.selfReason=&#x27;未提出のまま締切&#x27;;}publish();}
    else if(act===&#x27;invalidate&#x27;){const number=data.number||s.round;const round=s.rounds.find(r=&gt;r.number===number);if(round){round.invalid=true;s.notice=`第${number}曲を無効にしました。総合集計から除外しました。`;}else publish(true);}
    else if(act===&#x27;next&#x27;){s.phase=&#x27;picking&#x27;;s.pickerOpen=false;s.round++;s.chart=null;s.candidate=null;s.selfReady=false;s.selfStatus=&#x27;pending&#x27;;s.ready=0;s.submitted=0;s.nextWait=false;s.casualWait=false;s.pending=0;s.detail=false;s.resultTab=&#x27;round&#x27;;s.playingIds=null;s.submittedIds=null;s.reviewRestIds=[];s.absences=[];s.submissionsComplete=false;}
    else if(act===&#x27;end&#x27;){if(s.phase===&#x27;play&#x27;)publish(true);s.phase=&#x27;final&#x27;;s.detail=false;s.endReason=&#x27;Hostが終了&#x27;;s.historyMode=&#x27;complete&#x27;;}
    else if(act===&#x27;leave&#x27;){s.left=true;s.joined=false;s.view=&#x27;entry&#x27;;s.historyMode=&#x27;partial&#x27;;}
    else if(act===&#x27;return&#x27;){s.left=false;s.joined=true;s.started=true;s.fixedN=tournament()?(s.fixedN||s.people):null;s.view=&#x27;room&#x27;;s.phase=&#x27;ready&#x27;;s.chart=charts[0];s.nextWait=true;s.pending=tournament()?0:1;}
    else if(act===&#x27;kick&#x27;){if(s.phase===&#x27;play&#x27;&amp;&amp;isSubmitted(data.person))s.kickedSubmitted=[...(s.kickedSubmitted||[]),data.person];s.kicked.push(data.person);s.notice=`${displayName(data.person)}をKickしました。${tournament()?&#x27;大会の配点人数は変わりません。&#x27;:&#x27;次の選曲対象から外れます。&#x27;}`;}
