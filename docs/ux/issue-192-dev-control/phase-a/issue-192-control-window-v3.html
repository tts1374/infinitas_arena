<div id="i192-v3">
  <details class="review-tools"><summary>画面の状態を切り替えて確認する <span>試作・通信しません</span></summary><div class="review-controls">
    <label>モード<select data-review="mode"><option>ARENA</option><option>BPL</option><option>BPL4</option><option>合同プレー</option><option>大会</option></select></label>
    <label>場面<select data-review="scene"></select></label>
    <label>主催者<select data-review="host"><option value="a">自分</option><option value="b">相手1</option></select></label>
    <label>選択した人<select data-review="person"><option value="pending">接続中・未提出</option><option value="ready">準備完了</option><option value="submitted">提出済み</option><option value="absent">欠場で確定</option><option value="next">次の曲から参加</option><option value="disconnected">一時切断中</option><option value="left">退出済み</option></select></label>
    <label class="check"><input type="checkbox" data-review="host-offline">主催者が切断中</label>
  </div></details>
  <div class="main-window" hidden aria-hidden="true"><span class="main-mode"></span><span class="main-phase"></span><div class="song"><b></b></div><div class="main-guide"></div><div class="main-players"></div></div>
  <section class="product" aria-label="動作確認の操作ウィンドウ">
    <header class="titlebar"><b>動作確認</b><span class="window-caption">操作用ウィンドウ</span></header>
    <div class="environment"><div><b>ローカル</b><span class="session-mode"></span><span class="endpoint">127.0.0.1:8787</span></div>
      <details class="popover session-menu"><summary>確認全体の操作 <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="popover-body">
        <div class="action"><button type="button" data-action="restart">最初からやり直す…</button></div><div class="action"><button type="button" data-action="with-window">画面ありで起動し直す…</button><small data-reason="with-window"></small></div><div class="action divided"><button type="button" data-action="stop" class="danger">動作確認を終了する…</button></div>
        <span class="running secondary"></span><span class="session-people" hidden></span>
      </div></details>
    </div>
    <div class="progress-area"><div><h1 class="phase"></h1><div class="host-name secondary"></div><div class="host-guide secondary" role="status"></div><span class="round-name" hidden></span></div><div class="progress-actions">
      <div class="flow-primary">
        <div class="action"><button type="button" data-action="start" class="primary">開催を開始する</button><small data-reason="start"></small></div>
        <div class="action"><button type="button" data-action="host-pick" class="primary">主催者が曲を確定する</button><small data-reason="host-pick"></small></div>
        <div class="action"><button type="button" data-action="play" class="primary">この曲を開始</button><small data-reason="play"></small></div>
        <div class="action"><button type="button" data-action="next" class="primary">次の曲を選ぶ</button><small data-reason="next"></small></div>
        <div class="action"><button type="button" data-action="rematch" class="primary">待機室へ戻って再戦する</button><small data-reason="rematch"></small></div>
      </div>
      <details class="popover flow-menu"><summary>進行の調整 <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="popover-body">
        <div class="action"><button type="button" data-action="cancel-pick">確定を取り消して選び直す…</button><small data-reason="cancel-pick"></small></div>
        <div class="action"><button type="button" data-action="close">未提出の人を欠場にして締め切る…</button><small data-reason="close"></small></div>
        <div class="action"><button type="button" data-action="end" class="danger">開催を終了する…</button><small data-reason="end"></small></div>
      </div></details>
    </div></div>
    <div class="workarea"><aside class="roster" aria-label="操作する人を選ぶ"><div class="rail-title"><b>参加者</b><span class="people-count"></span></div><div class="roster-buttons"></div><button type="button" data-action="add" class="quiet add-person">参加者を追加</button><small data-reason="add"></small></aside>
      <div class="target"><div class="target-top"><div><h2 class="target-name"></h2><div class="target-kind secondary"></div><div class="target-status" hidden></div></div>
        <details class="popover connection-menu"><summary>接続のテスト <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="popover-body">
          <div class="action"><button type="button" data-action="disconnect">接続を切る（席は残す）</button><small data-reason="disconnect"></small></div><div class="action"><button type="button" data-action="reconnect">つなぎ直す</button><small data-reason="reconnect"></small></div><div class="action divided"><button type="button" data-action="leave" class="danger">部屋から退出する…</button><small data-reason="leave"></small></div>
          <div class="action divided focus-holder"><button type="button" data-action="focus">この人の画面を表示</button><small data-reason="focus"></small></div>
        </div></details>
      </div>
      <div class="target-body">
        <div class="own-source" hidden><b>自分はアプリで操作します</b><span>結果は普段の連携ソフトから読み取ります。</span><div class="own-focus"></div></div>
        <div class="participant-actions"><div class="action"><button type="button" data-action="ready" class="primary">準備完了にする</button><small data-reason="ready"></small></div><div class="action"><button type="button" data-action="pick" class="primary">この人の曲を選ぶ</button><small data-reason="pick"></small></div></div>
        <div class="test-input"><div class="waiting"><div class="waiting-message"></div><div class="preview-values"><span>EXスコア <b class="preview-score">1800</b></span><span>ミスカウント <b class="preview-miss">20</b></span></div></div>
          <div class="submission-form"><div class="input-row"><label>EXスコア<input data-field="score" type="number" min="0" max="4000" value="1800"></label><label>ミスカウント<input data-field="miss" type="number" min="0" value="20"></label></div><div class="action send-action"><button type="button" data-action="submit" class="primary">この結果を送る</button><small data-reason="submit"></small></div></div>
          <div class="send-preferences"><span class="policy-status secondary"></span><details class="send-settings"><summary>送信設定 <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="settings-body"><b class="value-scope">次の提出で使う値</b><div class="input-row"><label>EXスコア<input data-setting="score" type="number" min="0" max="4000" value="1800"></label><label>ミスカウント<input data-setting="miss" type="number" min="0" value="20"></label></div><small class="value-note">値の変更は保存されます。結果を送る操作とは別です。</small><label>結果の送り方<select data-field="policy"><option value="manual">ボタンを押したときだけ</option><option value="auto">毎曲、プレー開始後に自動で送る</option><option value="delay">ボタンを押して10秒後に送る</option><option value="hold">結果を送らずに待つ</option></select></label><div class="action"><button type="button" data-action="apply" class="secondary-button">送り方を適用</button><small data-reason="apply"></small></div></div></details></div>
        </div>
      </div>
      <details class="input-details"><summary>入力元と確認できる範囲 <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="input-route secondary"></div></details>
      <button type="button" data-tab="result" hidden></button><button type="button" data-tab="connection" hidden></button>
    </div></div>
    <footer class="record"><div class="record-heading"><details class="record-details"><summary>操作記録 <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="record-info">画面は操作イメージです。通信・ファイルへの書込みは行いません。実装時は操作、送信、受付、失敗を区別して保存します。</div></details><button type="button" data-action="evidence" class="quiet">保存</button></div><div class="log" role="status" aria-live="polite">相手1が接続しました（表示例）</div></footer>

  </section>
</div>

<script>
(() => {
  const root=document.getElementById('i192-v3'), q=s=>root.querySelector(s), all=s=>[...root.querySelectorAll(s)];
  const modes=['ARENA','BPL','BPL4','合同プレー','大会'];
  const labels={normal:['参加者・準備待ち','アプリで曲を選ぶ','ゲーム内選曲・開始カウント','プレー・結果提出待ち','この曲の結果を見る','対戦の最終結果','部屋が終了・解散'],event:['参加者待ち','主催者が曲を選ぶ','主催者のプレー開始待ち','プレー・結果提出待ち','この曲の結果を見る','開催の最終結果','部屋が終了・解散']};
  let mode='合同プレー',phase=2,host='b',target='b',live=true,round=1,epoch=0,confirmation=null,people=[],roundIds=[],rosterIds=[];
  const timers=new Map(), ev=()=>mode==='合同プレー'||mode==='大会', p=()=>people.find(x=>x.id===target), h=()=>people.find(x=>x.id===host);
  const requiredPicks=()=>mode==='BPL4'?2:1;
  const currentLabels=()=>ev()?labels.event:labels.normal;
  function makePeople(){return ['a','b','c','d'].slice(0,mode==='BPL'||mode==='BPL4'?2:4).map((id,i)=>({id,name:i===0?'自分':`相手${i}`,connected:true,left:false,submitted:false,absent:false,next:false,ready:false,picks:0,score:1800,miss:20,policy:'manual',draftPolicy:'manual',scheduled:false,window:i===0}));}
  function cancelPerson(x){if(timers.has(x.id))clearTimeout(timers.get(x.id));timers.delete(x.id);x.scheduled=false;}
  function cancelAll(){timers.forEach(clearTimeout);timers.clear();people.forEach(x=>x.scheduled=false);}

    const playing=currentPlayers(),done=playing.filter(y=>y.submitted||y.absent).length;
    q('.host-name').textContent=phase===3?`提出・欠場確定 ${done} / ${playing.length}人 · 主催者：${h().name}`:`主催者：${h().name}`;
    q('.host-guide').textContent=live&&!ended&&e&&!h().connected?'主催者の再接続を待っています。開始済みの曲への結果は送れます。':!e&&phase===2?'カウントに合わせてプレーを開始します。':!e&&phase===4?'次のROUNDへ自動で進みます。':'';
    q('.target-name').textContent=x.name;
    const shortStatus=y=>y.left?'退出済み':!y.connected?'切断中':y.absent?'欠場確定':y.next?'次曲から参加':y.submitted?'提出済み':y.scheduled?'送信予約中':!e&&phase===0?y.ready?'準備完了':'準備待ち':!e&&phase===1?`選曲 ${y.picks}/${requiredPicks()}曲`:'接続中';
    q('.target-kind').textContent=`${x.window?'アプリ画面あり':'画面なし'} · ${shortStatus(x)}`;
    const rosterButtons=all('.roster-buttons button');
    rosterButtons.forEach((button,i)=>{const y=people[i];const sub=button.querySelector('span');button.firstChild.textContent=y.name;sub.textContent=`${y.id===host?'主催者 · ':''}${shortStatus(y)}`;});
    // Current-step commands stay in a stable progression area. Other actions
    // keep their matrix guards but live inside named secondary disclosures.
    show('start',phase===0&&(e||!stateReason('start')));
    show('host-pick',e&&phase===1);show('play',e&&phase===2);show('next',e&&phase===4);show('rematch',!e&&phase===5);
    q('[data-action="play"]').textContent='この曲を開始';
    show('cancel-pick',e&&phase===2);show('close',e?phase===3:phase===2||phase===3);show('end',e&&phase<5);
    q('.flow-menu').hidden=ended||!live||all('.flow-menu .action').every(el=>el.hidden);
    const normalReady=!e&&!own&&phase===0;
    const normalPick=!e&&!own&&phase===1;
    q('.participant-actions').hidden=!(normalReady||normalPick);
    show('ready',normalReady);show('pick',normalPick);
    q('[data-action="ready"]').classList.toggle('primary',!x.ready);
    // The normal start condition has one short status instead of an inactive
    // start button alongside every participant's Ready command.
    if(!e&&phase===0&&stateReason('start'))q('.host-guide').textContent=stateReason('start');
    const cannotSend=ended||!live||x.left||!x.connected||x.next||x.submitted||x.absent;
    const showForm=phase===3&&!own&&!cannotSend;
    q('.submission-form').hidden=!showForm;
    q('.waiting').hidden=showForm||own||normalReady||normalPick;
    let message='プレーが始まったら、結果を送れます';
    if(!live)message='動作確認は終了しています';
    else if(ended)message='この対戦・開催は終了しました。記録を保存するか、最初からやり直せます';
    else if(x.left)message='この人は部屋から退出しています';
    else if(!x.connected)message='接続が切れています。「接続のテスト」からつなぎ直せます';
    else if(x.absent)message='この曲は欠場で確定しました';
    else if(x.next)message='この人は次の曲から参加します';
    else if(x.submitted&&phase===3)message=x.acceptedResult?`この曲は EX ${x.acceptedResult.score}・ミス ${x.acceptedResult.miss} で受け付けられました`:'この人の結果は受け付けられました';
    else if(phase>=4)message=phase===4?'この曲の結果が確定しました':'この対戦・開催は終了しました';
    q('.waiting-message').textContent=message;
    q('.preview-values').hidden=ended||x.left||!x.connected||x.next||x.absent||x.submitted||phase===4;
    q('.preview-score').textContent=Number.isFinite(x.score)?String(x.score):'未入力';q('.preview-miss').textContent=Number.isFinite(x.miss)?String(x.miss):'未入力';
    q('.send-preferences').hidden=own||ended||!live;
    q('.policy-status').textContent=`送り方：${{manual:'手動',auto:'毎曲自動',delay:'10秒後',hold:'送らずに待つ'}[x.policy]}`;
    q('[data-setting="score"]').value=Number.isFinite(x.score)?x.score:'';q('[data-setting="miss"]').value=Number.isFinite(x.miss)?x.miss:'';
    const nextOnly=x.submitted||x.absent||x.next||phase===4;
    q('.value-scope').textContent=nextOnly?'次の曲で使う値':'次の提出で使う値';
    q('.value-note').textContent=nextOnly?'この曲の確定結果は変わりません。値の変更は次の曲に使います。':'値の変更は保存されます。結果を送る操作とは別です。';
    q('[data-action="apply"]').textContent=x.draftPolicy==='auto'&&canAutoSend(x)?'この曲にも送って、毎曲自動にする…':'送り方を適用';
    q('[data-action="submit"]').textContent=x.policy==='delay'?'10秒後にこの結果を送る':'この結果を送る';
    if(x.policy==='auto'||x.policy==='hold'){
      q('.submission-form').hidden=true;q('.waiting').hidden=false;
      if(!cannotSend&&phase===3)q('.waiting-message').textContent=x.policy==='auto'?'プレー開始後に自動で結果を送ります':'この人は結果を送らずに待ちます';
    }
    const holder=q('.focus-holder');
    if(own){q('.own-focus').append(holder);holder.hidden=!live;q('[data-action="focus"]').classList.toggle('primary',!all('.flow-primary .action').some(el=>!el.hidden&&!el.querySelector('button').disabled));q('[data-action="focus"]').textContent='自分の画面を開く';}
    else{q('.connection-menu .popover-body').append(holder);holder.hidden=!x.window;q('[data-action="focus"]').classList.remove('primary');q('[data-action="focus"]').textContent='この人の画面を表示';}
    show('with-window',!own&&!x.window);
    q('[data-action="with-window"]').textContent=`${x.name}を画面ありで起動し直す…`;
    q('[data-action="reconnect"]').textContent='つなぎ直す';q('[data-action="leave"]').textContent='部屋から退出する…';
    if(ended)q('.send-settings').open=false;
  }
  root.addEventListener('click',event=>{
    const control=event.target.closest('button');
    if(control?.dataset.person||control?.dataset.action){all('.popover').forEach(el=>el.open=false);}
    const summary=event.target.closest('.popover > summary');
    if(summary){const owner=summary.parentElement;all('.popover').filter(el=>el!==owner).forEach(el=>el.open=false);}
  });
  document.addEventListener('click',event=>{if(!root.contains(event.target))all('.popover').forEach(el=>el.open=false);});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){all('.popover[open]').forEach(el=>{el.open=false;el.querySelector('summary').focus();});}});
  q('.confirmation').addEventListener('cancel',event=>{event.preventDefault();cancelConfirmation();});
  if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});

  people=makePeople();freezeRound();restore(window.openai?.widgetState?.modelContent);render();
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState?.modelContent));
})();

</script>
