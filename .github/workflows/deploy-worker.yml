name: Deploy infinitas-arena Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

env:
  WORKER_DIR: apps/worker
  WORKER_NAME: infinitas-arena
  WORKER_SMOKE_PATH: /api/charts?play_style=SP&level_filter=ANY

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Validate deploy configuration
        env:
          CLOUDFLARE_API_TOKEN_WORKER: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          required_vars=(
            CLOUDFLARE_API_TOKEN_WORKER
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_WORKERS_SUBDOMAIN
            ISSUE_TOKEN
            DISCORD_WEBHOOK_URL
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Put Worker secret ISSUE_TOKEN
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN_WORKER: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
        run: |
          printf "%s" "${ISSUE_TOKEN}" | CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN_WORKER}" npx wrangler secret put ISSUE_TOKEN

      - name: Put Worker secret DISCORD_WEBHOOK_URL
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN_WORKER: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          printf "%s" "${DISCORD_WEBHOOK_URL}" | CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN_WORKER}" npx wrangler secret put DISCORD_WEBHOOK_URL

      - name: Deploy Worker with Wrangler
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN_WORKER: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN_WORKER}" npx wrangler deploy

      - name: Smoke check workers.dev deployment
        env:
          WORKER_SMOKE_URL: https://${{ env.WORKER_NAME }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev${{ env.WORKER_SMOKE_PATH }}
        run: |
          body_file="$(mktemp)"

          for attempt in 1 2 3 4 5; do
            status_code="$(curl --silent --show-error --output "${body_file}" --write-out "%{http_code}" "${WORKER_SMOKE_URL}")"

            if [[ "${status_code}" == 2* ]]; then
              echo "Smoke check passed on attempt ${attempt}: ${WORKER_SMOKE_URL}"
              exit 0
            fi

            if [[ "${attempt}" -eq 5 ]]; then
              echo "Smoke check failed with HTTP ${status_code}: ${WORKER_SMOKE_URL}" >&2
              cat "${body_file}" >&2
              exit 1
            fi

            sleep 5
          done
