name: Release Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-stable
  cancel-in-progress: false

jobs:
  preflight_validate_full:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      profile: full

  release:
    needs: preflight_validate_full
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.release_meta.outputs.app_version }}
      app_target: ${{ steps.release_meta.outputs.app_target }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Validate release secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLOUDFLARE_API_TOKEN_RELEASE: ${{ secrets.CLOUDFLARE_API_TOKEN_RELEASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_R2_BASE_URL: ${{ vars.PUBLIC_R2_BASE_URL }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          $required = @{
            TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            CLOUDFLARE_API_TOKEN_RELEASE = $env:CLOUDFLARE_API_TOKEN_RELEASE
            CLOUDFLARE_ACCOUNT_ID = $env:CLOUDFLARE_ACCOUNT_ID
            PUBLIC_R2_BASE_URL = $env:PUBLIC_R2_BASE_URL
            CLOUDFLARE_WORKERS_SUBDOMAIN = $env:CLOUDFLARE_WORKERS_SUBDOMAIN
          }

          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing required value: $($entry.Key)"
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: release_meta
        env:
          VAR_CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
        run: |
          $version = (node scripts/release/get-tauri-version.mjs | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version extraction returned empty output."
          }

          $appTarget = "windows-x86_64"

          $bucket = $env:VAR_CLOUDFLARE_R2_BUCKET
          if ([string]::IsNullOrWhiteSpace($bucket)) {
            $bucket = "infinitas-arena-updates"
          }

          $bundleDir = "apps/client/src-tauri/target/release/bundle/msi"
          $artifactDir = Join-Path $env:RUNNER_TEMP "desktop-release\$version"
          $r2ObjectPrefix = "releases/$version/$appTarget"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_target=$appTarget"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "bundle_dir=$bundleDir"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact_dir=$artifactDir"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "r2_bucket=$bucket"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "r2_object_prefix=$r2ObjectPrefix"

      - name: Guard release version progression
        env:
          PUBLIC_R2_BASE_URL: ${{ vars.PUBLIC_R2_BASE_URL }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.app_version }}
        run: |
          $publicR2BaseUrl = $env:PUBLIC_R2_BASE_URL.Trim().TrimEnd("/")
          $releaseVersionRaw = $env:RELEASE_VERSION

          if ([string]::IsNullOrWhiteSpace($releaseVersionRaw)) {
            throw "Release version is empty."
          }

          $latestUrl = "$publicR2BaseUrl/channels/stable/latest.json"
          Write-Host "Checking published latest version: $latestUrl"

          try {
            $latestResponse = Invoke-WebRequest -Uri $latestUrl -UseBasicParsing -ErrorAction Stop
          } catch {
            throw "Failed to fetch published latest.json from $latestUrl"
          }

          if ($latestResponse.Content -is [byte[]]) {
            $latestRaw = [System.Text.Encoding]::UTF8.GetString($latestResponse.Content)
          } else {
            $latestRaw = [string]$latestResponse.Content
          }

          if ([string]::IsNullOrWhiteSpace($latestRaw)) {
            throw "Published latest.json is empty: $latestUrl"
          }

          try {
            $latest = $latestRaw | ConvertFrom-Json
          } catch {
            throw "Published latest.json is not valid JSON: $latestUrl"
          }

          $publishedVersionRaw = "$($latest.version)".Trim()
          if ([string]::IsNullOrWhiteSpace($publishedVersionRaw)) {
            throw "Published latest.json does not include version: $latestUrl"
          }

          $normalize = {
            param([string]$value)
            $normalized = $value.Trim()
            if ($normalized.StartsWith("v")) {
              $normalized = $normalized.Substring(1)
            }
            return $normalized
          }

          $releaseVersion = & $normalize $releaseVersionRaw
          $publishedVersion = & $normalize $publishedVersionRaw

          $comparable = $true
          try {
            $releaseVersionObj = [Version]$releaseVersion
            $publishedVersionObj = [Version]$publishedVersion
          } catch {
            $comparable = $false
          }

          if ($comparable) {
            if ($releaseVersionObj -le $publishedVersionObj) {
              throw "Release version '$releaseVersionRaw' is not newer than published latest '$publishedVersionRaw'. Auto-update requires a newer version."
            }
          } elseif ($releaseVersion -eq $publishedVersion) {
            throw "Release version '$releaseVersionRaw' matches published latest '$publishedVersionRaw'. Auto-update requires a newer version."
          }

          Write-Host "Release version progression check passed. release=$releaseVersionRaw published_latest=$publishedVersionRaw"

      - name: Build signed Windows updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $publicR2BaseUrl = "${{ vars.PUBLIC_R2_BASE_URL }}".Trim().TrimEnd("/")
          $workerSubdomain = "${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}".Trim()
          $workerApiBaseUrl = "https://infinitas-arena.$workerSubdomain.workers.dev"
          $updaterEndpoint = "$publicR2BaseUrl/channels/stable/latest.json"
          $tauriConfigOverride = @{
            plugins = @{
              updater = @{
                endpoints = @($updaterEndpoint)
              }
            }
          } | ConvertTo-Json -Compress -Depth 8

          $env:TAURI_CONFIG = $tauriConfigOverride
          $env:VITE_WORKER_API_BASE_URL = $workerApiBaseUrl
          npm --workspace @infinitas/client run tauri:build

      - name: Collect and normalize updater artifacts
        run: |
          .\scripts\release\collect-updater-artifacts.ps1 `
            -BundleDirectory "${{ steps.release_meta.outputs.bundle_dir }}" `
            -Version "${{ steps.release_meta.outputs.app_version }}" `
            -OutputDirectory "${{ steps.release_meta.outputs.artifact_dir }}"

      - name: Upload normalized updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-updater-${{ steps.release_meta.outputs.app_version }}
          path: ${{ steps.release_meta.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Upload updater artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_RELEASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          .\scripts\release\publish-updater-artifacts.ps1 `
            -BucketName "${{ steps.release_meta.outputs.r2_bucket }}" `
            -ObjectPrefix "${{ steps.release_meta.outputs.r2_object_prefix }}" `
            -ArtifactDirectory "${{ steps.release_meta.outputs.artifact_dir }}"

      - name: Generate updater latest.json
        run: |
          .\scripts\release\generate-updater-latest-json.ps1 `
            -Version "${{ steps.release_meta.outputs.app_version }}" `
            -Target "${{ steps.release_meta.outputs.app_target }}" `
            -PublicR2BaseUrl "${{ vars.PUBLIC_R2_BASE_URL }}" `
            -SignatureFile (Join-Path "${{ steps.release_meta.outputs.artifact_dir }}" "app.msi.sig") `
            -OutputPath (Join-Path "${{ steps.release_meta.outputs.artifact_dir }}" "latest.json") `
            -Notes "Release notes are managed in GitHub Releases."

      - name: Upload updater latest.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_RELEASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $latestPath = Join-Path "${{ steps.release_meta.outputs.artifact_dir }}" "latest.json"
          $latestObject = "${{ steps.release_meta.outputs.r2_bucket }}/channels/stable/latest.json"

          & npx wrangler r2 object put $latestObject --file $latestPath --remote
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload latest.json to R2: $latestObject"
          }

      - name: Post-check published artifacts and latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_RELEASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "release-post-check"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null

          $bucket = "${{ steps.release_meta.outputs.r2_bucket }}"
          $prefix = "${{ steps.release_meta.outputs.r2_object_prefix }}"
          $expectedVersion = "${{ steps.release_meta.outputs.app_version }}"
          $publicR2BaseUrl = "${{ vars.PUBLIC_R2_BASE_URL }}".Trim().TrimEnd("/")
          $expectedDownloadUrl = "$publicR2BaseUrl/$prefix/app.msi"

          $msiObject = "$bucket/$prefix/app.msi"
          $sigObject = "$bucket/$prefix/app.msi.sig"
          $msiPath = Join-Path $verifyDir "app.msi"
          $sigPath = Join-Path $verifyDir "app.msi.sig"
          $latestPath = Join-Path $verifyDir "latest.json"

          & npx wrangler r2 object get $msiObject --file $msiPath --remote
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify R2 object: $msiObject"
          }

          & npx wrangler r2 object get $sigObject --file $sigPath --remote
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify R2 object: $sigObject"
          }

          $msiSize = (Get-Item -LiteralPath $msiPath).Length
          $sigContent = (Get-Content -Raw -LiteralPath $sigPath).Trim()
          if ($msiSize -le 0) {
            throw "Verified MSI object is empty."
          }
          if ([string]::IsNullOrWhiteSpace($sigContent)) {
            throw "Verified MSI signature object is empty."
          }

          $latestUrl = "$publicR2BaseUrl/channels/stable/latest.json"
          try {
            Invoke-WebRequest -Uri $latestUrl -OutFile $latestPath -ErrorAction Stop
          } catch {
            throw "Failed to download latest JSON from: $latestUrl"
          }

          $latestRaw = (Get-Content -Raw -LiteralPath $latestPath)
          if ([string]::IsNullOrWhiteSpace($latestRaw)) {
            throw "Downloaded latest.json is empty."
          }

          $latest = $latestRaw | ConvertFrom-Json

          if ($latest.version -ne $expectedVersion) {
            throw "latest.json version '$($latest.version)' does not match released version '$expectedVersion'."
          }

          $platformEntry = $latest.platforms.'windows-x86_64'
          if ($null -eq $platformEntry) {
            throw "latest.json is missing platforms.windows-x86_64."
          }

          if ($platformEntry.url -ne $expectedDownloadUrl) {
            throw "latest.json url '$($platformEntry.url)' does not match expected '$expectedDownloadUrl'."
          }

          if ([string]::IsNullOrWhiteSpace($platformEntry.signature)) {
            throw "latest.json platforms.windows-x86_64.signature is empty."
          }

  github_release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build GitHub Release body template
        env:
          APP_VERSION: ${{ needs.release.outputs.app_version }}
          APP_TARGET: ${{ needs.release.outputs.app_target }}
          PUBLIC_R2_BASE_URL: ${{ vars.PUBLIC_R2_BASE_URL }}
        run: |
          download_url="${PUBLIC_R2_BASE_URL%/}/releases/${APP_VERSION}/${APP_TARGET}/app.msi"

          cat > release-notes.md <<EOF
          ## Version
          - INFINITAS Arena v${APP_VERSION}

          ## Download URL
          - Windows (${APP_TARGET}): ${download_url}

          ## Changes
          - Fill in the release-specific changes here.

          ## Notes
          - Desktop binaries are distributed via Cloudflare R2.
          - GitHub Release assets are intentionally not used for binaries.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.release.outputs.app_version }}
        run: |
          tag="v${APP_VERSION}"
          title="INFINITAS Arena v${APP_VERSION}"

          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "$title" \
            --notes-file release-notes.md
